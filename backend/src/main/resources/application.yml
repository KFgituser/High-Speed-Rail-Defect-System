server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/railline?sslMode=DISABLED&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT:10000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT:5000}
      maximum-pool-size: ${DB_MAX_POOL_SIZE:5}
      keepalive-time: ${DB_KEEPALIVE_TIME:300000}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none}

  web:
    resources:
      static-locations:
        - file:${VIZ_RUNS_DIR:./runs}/
        - file:${VIZ_OUTPUT_DIR:./output}/

viz:
  python: ${VIZ_PYTHON:C:/Python313/python.exe}
  script2d: ${VIZ_SCRIPT_2D:../python-analysis/scripts/front_side_2D.py}
  script3d: ${VIZ_SCRIPT_3D:../python-analysis/scripts/front_side_3D.py}
  script3damp: ${VIZ_SCRIPT_3D_AMP:../python-analysis/scripts/front_side_3Damps_server.py}
  outDir: ${VIZ_OUTPUT_DIR:./output}
  workDir: ${VIZ_WORK_DIR:./runs}

app:
  data:
    npyDir: ${NPY_DIR:./data}
    thumbsDir: ${THUMBS_DIR:./runs/thumbs}
    plotsDir: ${PLOTS_DIR:./runs/plots}
  python:
    exe: ${PYTHON_EXE:C:/Python313/python.exe}
    script: ${ANALYZE_SCRIPT:../python-analysis/scripts/plot_npy.py}
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-secret-at-least-32-bytes}
    expire-minutes: ${JWT_EXPIRE_MINUTES:120}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.bjtu.raillinebackend: ${LOG_LEVEL_APP:DEBUG}
