services:
  mysql:
    image: mysql:8.4
    container_name: rail-defect-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-railline}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - rail_defect_mysql:/var/lib/mysql
      - ../database:/docker-entrypoint-initdb.d:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
    container_name: rail-defect-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-railline}?sslMode=DISABLED&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      APP_JWT_ISSUER: rail-line-backend
      INIT_ADMIN_ENABLED: ${INIT_ADMIN_ENABLED:-true}
      INIT_ADMIN_USERNAME: ${INIT_ADMIN_USERNAME}
      INIT_ADMIN_PASSWORD: ${INIT_ADMIN_PASSWORD}
      PYTHON_EXE: /opt/venv/bin/python
      JH_CODEBASE_DIR: /external/jh-codebase
      NPY_DIR: /external/npy
      PYTHONPATH: /external/jh-codebase
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: ${JH_CODEBASE_HOST_DIR:-../python-analysis/scripts}
        target: /external/jh-codebase
      - type: bind
        source: ${NPY_HOST_DIR:-../python-analysis}
        target: /external/npy
        read_only: true

  frontend:
    build:
      context: ../frontend
    container_name: rail-defect-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  rail_defect_mysql:
